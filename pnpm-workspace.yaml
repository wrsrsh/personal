packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.4.2'
  - '@astrojs/mdx@8.1.1'

# Security floors for dependencies pinned by adapters.
overrides:
  "undici@>=7.0.0 <7.29.1": ^7.29.1
  "ws@>=8.0.0 <8.21.0": ^8.21.0
  "esbuild@>=0.27.0 <0.28.1": ^0.28.1
  "sharp@<0.35.5": ^0.35.5
  "source-map-js@<1.2.2": ^1.2.2
